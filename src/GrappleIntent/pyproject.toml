[project]
name = "grapple-intent"
version = "0.1.0"
description = "Hierarchical Vision-Language-Action system for Grapple gesture control"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core ML
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "onnxruntime>=1.17",

    # Model tooling
    "transformers>=4.38",
    "peft>=0.9",                  # LoRA adapters
    "autoawq>=0.2",               # INT4-AWQ quantization

    # Data & experiment tracking
    "numpy>=1.26",
    "wandb>=0.16",
    "flatbuffers>=25.2",

    # Shared memory IPC
    "mmap",                        # stdlib, listed for clarity

    # Config & utilities
    "pyyaml>=6.0",
    "rich>=13.0",                  # Console logging
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
]
tensorrt = [
    "onnxruntime-gpu>=1.17",      # TensorRT/CUDA backend
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
