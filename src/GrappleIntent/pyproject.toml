[project]
name = "grapple-intent"
version = "0.1.0"
description = "Hierarchical Vision-Language-Action system for gesture-based HCI"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Core ML
    "torch>=2.2",
    "torchvision>=0.17",
    "onnx>=1.15",
    "onnxruntime>=1.17",

    # Model architectures
    "transformers>=4.38",       # Vision-Language models
    "timm>=0.9",                # MobileNetV3 and other backbones
    "peft>=0.8",                # LoRA adapters

    # Quantization
    "autoawq>=0.2",             # AWQ INT4 quantization
    "onnxruntime-tools>=1.7",   # ONNX quantization utilities

    # Data
    "numpy>=1.26",
    "pillow>=10.0",
    "albumentations>=1.3",      # Augmentation pipeline

    # Experiment tracking
    "wandb>=0.16",

    # Serialization (shared with GrappleV2)
    "flatbuffers>=24.3",

    # Utilities
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.2",
    "nbstripout>=0.7",
]
directml = [
    "onnxruntime-directml>=1.17",
]
tensorrt = [
    "tensorrt>=8.6",
]
synthetic = [
    # Unity/Isaac Sim integration
    "opencv-python>=4.9",
    "scipy>=1.12",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests with C# pipeline",
]
